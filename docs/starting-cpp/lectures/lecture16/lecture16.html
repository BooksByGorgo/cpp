# CMPE 30: Lecture 16

From Struct to Class

---

---
# Learning Objectives

- Explain the difference between `struct` and `class`
- Use `public`, `private`, and `protected`
- Write default and parameterized constructors using member initializer lists
- Delegate one constructor to another
- Mark single-arg constructors `explicit`
- Write a destructor and understand when it runs
- Overload members and use default parameters

---
# Why Classes?
.lc[
```cpp
struct Song {
    std::string title;
    std::string artist;
    int year;
};

Song s;
s.year = -5;   // nothing stops this!
```
]
.rc[
- Any code can set `year` to garbage
- Functions that operate on a `Song` live separately from the data
- Classes bundle data **and** behavior with access control
]

---
# Access Specifiers

Three keywords:

- **`public`** --- accessible from anywhere
- **`private`** --- only accessible inside the class
- **`protected`** --- inside the class and derived classes (advanced)

**Wut:** `struct` and `class` are almost the same thing. The only difference: `struct` is public by default, `class` is private by default.

---
# A First Class
.lc[
```cpp
class Song {
private:
    std::string title;
    std::string artist;
    int year;
public:
    void set_year(int y) {
        if (y > 0) year = y;
    }
    int get_year() const {
        return year;
    }
};
```
]
.rc[
- Data is private; access is through member functions
- `set_year` validates input
- The interface controls how data is used
]

---
# Default Constructor
.lc[
```cpp
class Song {
    std::string title;
    std::string artist;
    int year;
public:
    Song()
        : title("Unknown"),
          artist("Unknown"),
          year(0) {}
};

Song s;   // calls default ctor
```
]
.rc[
- Runs when you create a `Song` with no arguments
- Same name as the class
- **No return type**
]

---
# Parameterized Constructor
.lc[
```cpp
class Song {
    std::string title;
    std::string artist;
    int year;
public:
    Song(const std::string &t,
         const std::string &a,
         int y)
        : title(t), artist(a), year(y) {}
};

Song b("Enter Sandman",
       "Metallica", 1991);
```
]
.rc[
- Takes arguments to initialize members
- The `: title(t)...` part is the **member initializer list**
]

---
# Member Initializer Lists

**Always prefer initializer lists over assignment in the constructor body.**

- More efficient (skips a default-construct-then-assign)
- **Required** for `const` members and references

**Trap:** Members are initialized in the order they are **declared** in the class, not the order in the initializer list. Keep them matching.

---
# Delegating Constructors
.lc[
```cpp
class Song {
    std::string title;
    std::string artist;
    int year;
public:
    Song(const std::string &t,
         const std::string &a, int y)
        : title(t), artist(a), year(y) {}

    // delegate with default values
    Song()
        : Song("Unknown", "Unknown", 0) {}
};
```
]
.rc[
- One constructor calls another via the initializer list
- Delegated-to constructor runs first, then the delegating body
- Delegation must be the **only** entry in the list

**Tip:** Delegate from the simplest constructors *to* the most complete one.
]

---
# explicit Constructors
.lc[
```cpp
class Volume {
public:
    explicit Volume(int l)
        : level(l) {}
    int level;
};

void play(Volume v) { }

play(11);            // ERROR
play(Volume(11));    // OK
```
]
.rc[
- Without `explicit`, the compiler silently converts `11` to `Volume(11)`
- `explicit` prevents surprise implicit conversions

**Trap:** Mark single-arg constructors `explicit` unless you specifically want implicit conversion.
]

---
# Destructors
.lc[
```cpp
class Song {
    std::string title;
public:
    Song(const std::string &t)
        : title(t) {
        std::cout << title << " on\n";
    }
    ~Song() {
        std::cout << title << " off\n";
    }
};
```
]
.rc[
- Same name, prefixed with `~`
- No parameters
- Runs automatically when the object is destroyed
- You do **not** call it yourself
]

---
# Destructor in Action
.lc[
```cpp
int main() {
    Song s("Black Hole Sun");
    std::cout << "stuff...\n";
}
```
]
.rc[
Output:

```
Black Hole Sun on
stuff...
Black Hole Sun off
```

- The destructor runs automatically at the end of the scope
- For classes containing only standard library types, the compiler-generated destructor is fine
]

---
# Order of Construction and Destruction
.lc[
```cpp
int main() {
    Song a("Torn");
    Song b("Vogue");
    Song c("Iris");
    // end of main:
    // c destroyed (most recent)
    // b destroyed
    // a destroyed
}
```
]
.rc[
- Locals are destroyed in **reverse order of construction**
- Last constructed, first destroyed --- like a stack
]

---
# Overloading Member Functions
.lc[
```cpp
class Playlist {
    std::vector<std::string> songs;
public:
    void add(const std::string &song) {
        songs.push_back(song);
    }
    void add(const std::string &song,
             int position) {
        songs.insert(
            songs.begin() + position, song);
    }
};

Playlist p;
p.add("Torn");            // 1-arg
p.add("Basket Case", 0);  // 2-arg
```
]
.rc[
- Same name, different parameter lists (chapter 6) --- works for members too
- You already saw it: two constructors **are** overloads
- One verb per concept keeps the interface clean
]

---
# Default Parameters in Members
.lc[
```cpp
class Playlist {
    std::vector<std::string> songs;
public:
    void add(const std::string &song,
             int position = -1) {
        int n = static_cast<int>(
            songs.size());
        if (position < 0 || position >= n) {
            songs.push_back(song);
        } else {
            songs.insert(
                songs.begin() + position,
                song);
        }
    }
};
p.add("Torn");            // appends
p.add("Basket Case", 1);  // inserts at 1
```
]
.rc[
- One function replaces the two overloads
- Defaults go at the **end** of the parameter list

**Trap:** Overloads plus defaults can make a call ambiguous --- the compiler rejects it.
]

# Where is the bug?
.lc[
```cpp
class Volume {
public:
    Volume(int l) : level(l) {}
    int level;
};

void play(Volume v) { }
play(11);
```
]
.rc[
1. Missing semicolon
1. `Volume` has no destructor
1. `Volume(int)` is not `explicit` --- probably not intended
1. `play` cannot take `Volume`
1. Ben got this wrong
]

---
# Key Points

- `class` = `struct` with private-by-default
- Use access specifiers to hide implementation
- **Always** use member initializer lists
- Delegate from simple constructors to the most complete one
- Mark single-arg constructors `explicit`
- Destructors run in **reverse order** of construction
- Overloads and default parameters work in members --- do not mix them ambiguously
