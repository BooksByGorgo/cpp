# CMPE 30: Lecture 19

shared_ptr and Move Semantics

---
# What is wrong with this code?
.lc[
```cpp

delete volumes;
```
]
.rc[
1. Missing `<memory>`
1. `delete` should be `delete[]`
1. `volumes` must be `const`
1. `new int[3]` is invalid
1. Ben got this wrong
]

---
# Learning Objectives

- Use `std::shared_ptr` with `std::make_shared`
- Explain reference counting
- Break reference cycles with `std::weak_ptr`; use `.lock()` and `.expired()`
- Get a raw pointer with `.get()` without transferring ownership
- Use `std::move` to transfer resources
- Describe the valid-but-unspecified state of a moved-from object
- Explain why returning a local is already cheap (RVO)

---
# std::shared_ptr
.lc[
```cpp
#include <memory>
#include <string>

auto song1 =
    std::make_shared<std::string>(
        "Under the Bridge");

auto song2 = song1;
// both own the same string
```
]
.rc[
- What if multiple parts of your code need to own the same object?
- **Reference counting** --- memory is freed when the **last** `shared_ptr` is destroyed
]

---
# Inspecting the Count
.lc[
```cpp
std::cout << song1.use_count();
// 2

song1.reset();
// song1 gives up ownership

std::cout << song2.use_count();
// 1
```
]
.rc[
- `.use_count()` returns the current reference count
- `.reset()` releases this `shared_ptr`'s ownership

**Tip:** Use `shared_ptr` only when you truly need shared ownership. `unique_ptr` is simpler.
]

---
# Reference Counting Leaks on Cycles
.lc[
```cpp
struct Song {
    std::string           title;
    std::shared_ptr<Song> related;
    Song(const std::string &t)
        : title(t) {}
};

auto a =
    std::make_shared<Song>("Today");
auto b =
    std::make_shared<Song>("Black");
a->related = b;
b->related = a;
// scope ends: nothing is freed!
```
]
.rc[
- Each `Song` still holds the other --- both counts stay at 1
- Neither destructor runs; the memory **leaks**
- Fix: make `related` a `std::weak_ptr<Song>` --- it observes without owning, and the cycle dissolves
]

---
# weak_ptr: .lock() and .expired()
.lc[
```cpp
auto strong =
    std::make_shared<std::string>(
        "Karma Police");
std::weak_ptr<std::string> w = strong;

if (auto live = w.lock()) {
    std::cout << *live << "\n";
}   // prints: Karma Police

strong.reset();  // last owner gone

if (auto live = w.lock()) {
    std::cout << *live << "\n";
} else {
    std::cout << "expired\n";
}   // prints: expired
```
]
.rc[
- You cannot dereference a `weak_ptr` directly --- the object might be gone
- `.lock()` returns a temporary `shared_ptr`, empty if expired
- `.expired()` --- true once the object is gone
- Use for back-pointers, observers, caches
]

---
# Getting a Raw Pointer
.lc[
```cpp
auto song =
    std::make_unique<std::string>(
        "Under the Bridge");

std::string *raw = song.get();

std::cout << *raw << "\n";
// song still owns the memory
// do NOT delete raw
```
]
.rc[
- `.get()` returns the raw pointer **without** releasing ownership
- For C library functions that expect raw pointers

**Trap:** **Never `delete`** a pointer from `.get()` --- double free.
]

# Move Semantics
.lc[
```cpp
#include <string>

std::string a = "Nothing Compares 2 U";
std::string b = std::move(a);

std::cout << "a: " << a << "\n";
// empty!

std::cout << "b: " << b << "\n";
// "Nothing Compares 2 U"
```
]
.rc[
- **Transfers** the contents instead of copying
- The actual buffer moves, not a duplicate
- `a` is left in a **valid but unspecified** state

**Trap:** After moving from an object, do not use it unless you reassign first.
]

---
# What std::move Actually Does

`std::move` does **not** actually move anything!

- It casts its argument to an **rvalue reference**
- Tells the compiler "it is OK to move from this"
- The actual move is performed by the receiving object's **move constructor** or **move assignment operator**
- You will learn about the Rule of Five next lecture

---
# Moving a unique_ptr
.lc[
```cpp
auto a =
    std::make_unique<Song>(
        "Don't Speak", "No Doubt");

auto b = std::move(a);
// a is empty; b owns the Song
```
]
.rc[
- This is the **only** way to transfer ownership between `unique_ptr`s
- After the move, `a` is `nullptr`
- `b` owns the heap object now
]

---
# Returning Large Objects
.lc[
```cpp
std::vector<int> make_scores() {
    std::vector<int> scores =
        {10, 20, 30, 40, 50};
    return scores;
    // RVO or move ---
    // never a deep copy
}
```
]
.rc[
- **Copy elision** (RVO): the object is built directly in the caller's memory
- When RVO does not apply, a **move** happens instead --- still cheap

**Trap:** Do not write `return std::move(local);` --- it defeats RVO and makes the code slower.
]

---
# Try It --- Shared Ownership in Action
.lc[
```cpp
std::shared_ptr<Song> s1;
{
    auto s2 = std::make_shared<Song>(
        "Under the Bridge", "RHCP");
    s1 = s2;
    std::cout << s1.use_count();
    // 2
}
// s2 destroyed, Song lives on
std::cout << s1.use_count();
// 1
s1->print();
// end of outer scope:
// s1 destroyed, Song finally freed
```
]
.rc[
- `s2` in the inner scope; `s1` in the outer
- `s1 = s2` makes both share the same `Song`
- When `s2` goes out of scope, the Song does **not** die --- `s1` still holds it
- Only when `s1` is destroyed does the Song's destructor run
]

# After std::move(a), what is the state of a?

Where `a` is a `std::unique_ptr<int>`:

1. Contains the same value as before
1. Contains garbage
1. Empty (`nullptr`); unsafe to dereference, safe to reassign
1. Has been deleted; the program crashes
1. Ben got this wrong

---
# Why NOT delete a pointer from .get()?

1. `.get()` returns `nullptr`
1. The smart pointer still owns the memory; a double-free follows
1. `delete` does not work on raw pointers
1. You would leak memory
1. Ben got this wrong

---
# Key Points

- `shared_ptr` uses reference counting --- last one out frees
- Counting leaks on cycles; `weak_ptr` observes without owning --- go through `.lock()`
- `.get()` yields a raw pointer; **do not delete** it
- `std::move` casts to rvalue reference; the target's move constructor does the work
- A moved-from object is **valid but unspecified**
- Returning a local is already cheap (RVO) --- never `return std::move(local)`
- Prefer `unique_ptr` unless sharing is required
